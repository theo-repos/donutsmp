name: Build Mod JAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Organize flat resources
        run: |
          mkdir -p src/main/resources/assets/donutsim
          find . -maxdepth 4 -name "fabric.mod.json" -exec cp {} src/main/resources/ \;
          find . -maxdepth 4 -name "donutsim.mixins.json" -exec cp {} src/main/resources/ \;
          find . -maxdepth 4 -name "en_us.json" -exec cp {} src/main/resources/assets/donutsim/ \;
      - name: Build JAR
        run: |
          gradle build > build_out.txt 2>&1 || (grep -i -E "FAILURE:|error:|Exception|Could not|cannot find" build_out.txt | tail -n 30; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: donutsim-jar
          path: build/libs/donutsim-1.0.0.jar
